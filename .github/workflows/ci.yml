name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Every push to main has commits of its own to read.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commits pushed to main, or what main does not have yet: the base of a pull request may change.
  COMMITS: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}..${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit is read, not only the last one.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm guard:ddd
      - run: pnpm guard:copy
      - run: pnpm guard:data
      - run: pnpm guard:data --commits "$COMMITS"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install gitleaks and osv-scanner
        working-directory: /tmp
        env:
          GITLEAKS: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          OSV_SCANNER: https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz "$GITLEAKS"
          curl --fail --silent --show-error --location --retry 3 --output osv-scanner "$OSV_SCANNER"
          sha256sum --check --strict <<'SUMS'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz
          fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner
          SUMS
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo install gitleaks osv-scanner /usr/local/bin
      # The tests of the secret check that need gitleaks itself.
      - run: pnpm vitest run guards/push/secrets.test.ts
      - run: pnpm guard:secrets "$COMMITS"
      - run: osv-scanner scan source --lockfile=pnpm-lock.yaml
      - run: pnpm guard:licenses

  # The one check to require on main. It is always reported, so no pull request waits for it in vain.
  check:
    if: always()
    needs: [lint, guards, test, build, e2e, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test -n "$RESULTS" || exit 1
          for result in $RESULTS; do test "$result" = success || exit 1; done
