<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Radavod</title>
    <script>
      // A dark page must not flash light before the app starts.
      try {
        if (localStorage.getItem("radavod.theme") === "dark") {
          document.documentElement.setAttribute("data-mantine-color-scheme", "dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
