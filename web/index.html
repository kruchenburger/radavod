<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Radavod</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // A dark page must not flash light before the app starts. Until the visitor picks a
      // theme, the browser's one holds.
      let chosen = null;
      try {
        chosen = localStorage.getItem("radavod.theme");
      } catch {}
      if (
        chosen === "dark" ||
        (chosen !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.setAttribute("data-mantine-color-scheme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
